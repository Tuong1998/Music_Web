<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodies - Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="log_in.css">
</head>

<body>

    <div class="login-container">
        <div class="brand">
            <i class="fa-solid fa-waveform-lines brand-icon"></i>
            <span class="brand-name"><i class="fa-solid fa-lines-leaning"
                    style="transform: rotate(90deg); margin-right: 5px; font-size: 18px;"></i>Melodies</span>
        </div>

        <h2 class="welcome-title">Chào mừng trở lại</h2>
        <p class="welcome-subtitle">Đăng nhập để tiếp tục nghe nhạc trên Melodies</p>

        <form class="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" value="password123" required>
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox">
                    <span class="checkmark"></span>
                    Ghi nhớ tôi
                </label>
                <a href="#" class="forgot-password">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-submit">
                Đăng nhập <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="divider">
            <span>HOẶC</span>
        </div>

        <div class="social-login">
            <button class="btn-social google">
                <i class="fa-brands fa-google"></i> Google
            </button>
            <button class="btn-social facebook">
                <i class="fa-brands fa-facebook-f"></i> Facebook
            </button>
        </div>

        <div class="signup-link">
            Bạn chưa có tài khoản? <a href="#">Đăng ký ngay</a>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">Điều khoản</a>
        <a href="#">Bảo mật</a>
        <a href="#">Trợ giúp</a>
    </div>

</body>

</html>
